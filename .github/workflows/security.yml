name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip_audit
      - run: git grep -nEI '(api[_-]?key|password|token).{12,}' -- ':!*.example' ':!tests/**' ':!docs/**' && exit 1 || test $? -eq 1
