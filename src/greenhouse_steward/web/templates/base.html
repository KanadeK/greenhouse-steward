<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{% block title %}Greenhouse Steward{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
    <script src="{{ url_for('static', path='vendor/plotly.min.js') }}" defer></script>
    <script src="{{ url_for('static', path='js/dashboard.js') }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="wordmark" href="/dashboard">Greenhouse Steward</a>
        <nav aria-label="Primary">
          <a aria-current="page" href="/dashboard">Status</a>
          <a href="/api/v1/profiles">Profiles JSON</a>
        </nav>
      </div>
    </header>
    <main id="main-content" class="page-shell" tabindex="-1">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <p>Local-first monitoring. No telemetry. No physical relay control.</p>
    </footer>
  </body>
</html>
